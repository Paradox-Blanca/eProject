# Cấu hình mẫu Nginx cho Grand Hotel Frontend (Single Page Application - React Vite)
# Đặt file này tại: /etc/nginx/sites-available/hotel-fe và symlink sang sites-enabled/

server {
    listen 80;
    server_name hotel.yourdomain.com; # Thay thế bằng domain hoặc IP của bạn

    root /var/www/hotel-fe;
    index index.html;

    # Cấu hình xử lý React Router (tránh lỗi 404 khi F5 tải lại trang)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache tĩnh cho file css, js, hình ảnh để tối ưu tốc độ
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Bật nén Gzip giảm dung lượng truyền tải
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

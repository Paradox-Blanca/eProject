name: CI/CD Deploy Hotel Frontend to Server

# ==============================================================================
# QUY TẮC BẢO MẬT:
# Toàn bộ thông tin nhạy cảm (SSH Key, Server IP, Mật khẩu Database, v.v.)
# TUYỆT ĐỐI KHÔNG ghi trực tiếp vào file này.
# Thay vào đó, chúng được cấu hình tại:
# GitHub Repository -> Settings -> Secrets and variables -> Actions
# ==============================================================================

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: # Cho phép trigger thủ công từ giao diện GitHub Actions

jobs:
  # ============================================================================
  # BƯỚC 1: KIỂM TRA, CÀI ĐẶT & BUILD BUNDLE PRODUCTION
  # ============================================================================
  build:
    name: 🔨 Build Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci || npm install

      - name: 🚀 Build Frontend Application (Vite)
        env:
          # Các biến môi trường frontend được truyền an toàn từ GitHub Secrets
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.grandhotel.vn' }}
          VITE_APP_ENV: production
        run: |
          npm run build

      - name: 📤 Archive production dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ============================================================================
  # BƯỚC 2: DEPLOY LÊN SERVER QUA SSH / RSYNC AN TOÀN
  # ============================================================================
  deploy:
    name: 🚀 Deploy to Production Server
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: 📥 Download production dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: 🔑 Configure SSH Key & Known Hosts
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 🚚 Transfer Build to Server via Rsync
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          TARGET_DIR: ${{ secrets.SERVER_TARGET_DIR || '/var/www/hotel-fe' }}
        run: |
          # 1. Tạo thư mục đích trên server nếu chưa có
          ssh -i ~/.ssh/id_rsa -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p $TARGET_DIR"

          # 2. Đồng bộ các file dist lên server (xóa file cũ không còn dùng để tiết kiệm dung lượng)
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa -p $SERVER_PORT" ./dist/ "$SERVER_USER@$SERVER_HOST:$TARGET_DIR/"

      - name: 🔄 Reload Nginx Web Server on Remote
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          # Reload Nginx zero-downtime mà không làm gián đoạn người dùng
          ssh -i ~/.ssh/id_rsa -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" << 'EOF'
            if command -v systemctl >/dev/null 2>&1; then
              sudo systemctl reload nginx || sudo service nginx reload || true
            elif command -v nginx >/dev/null 2>&1; then
              sudo nginx -s reload || true
            fi
            echo "✅ Frontend deployment & Nginx reload completed successfully!"
          EOF

      - name: 🧹 Cleanup SSH Keys
        if: always()
        run: |
          rm -rf ~/.ssh

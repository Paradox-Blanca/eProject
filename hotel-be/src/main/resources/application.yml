server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: grand-hotel-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/grandhotel;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # Supply APP_JWT_SECRET in every non-local environment (at least 32 random bytes).
    secret: ${APP_JWT_SECRET:development-only-secret-change-me-before-deploying-2026}
    access-token-minutes: ${APP_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${APP_REFRESH_TOKEN_DAYS:7}
  auth:
    max-failed-attempts: ${APP_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${APP_LOCK_MINUTES:15}
    rate-limit-per-minute: ${APP_RATE_LIMIT_PER_MINUTE:5}
    refresh-cookie-secure: ${APP_REFRESH_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  seed-demo-data: ${APP_SEED_DEMO_DATA:true}

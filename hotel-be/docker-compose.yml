services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grand_hotel
      POSTGRES_USER: grand_hotel
      POSTGRES_PASSWORD: grand_hotel_dev_password
    ports:
      - "5432:5432"
    volumes:
      - grand-hotel-postgres:/var/lib/postgresql/data

volumes:
  grand-hotel-postgres:
